<div class="tab-content">
  <div class="content-section-heading"><div><p class="eyebrow">PRACTICE OUT LOUD</p><h2>Common interview questions</h2></div><span>{{ questions().length }} questions</span></div>
  <mat-accordion class="question-list">
    @for (item of questions(); track item.question; let index = $index) {
      <mat-expansion-panel><mat-expansion-panel-header><mat-panel-title><span class="question-number">{{ index + 1 }}</span>{{ item.question }}</mat-panel-title></mat-expansion-panel-header><div class="answer-content"><p class="short-answer">{{ item.answer }}</p><p>{{ item.detail }}</p>@if (item.followUp) { <div class="follow-up"><strong>Follow-up to consider</strong><span>{{ item.followUp }}</span></div> }</div></mat-expansion-panel>
    }
  </mat-accordion>
</div>
