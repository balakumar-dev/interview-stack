<div class="tab-content notes-layout">
  <section class="notes-editor"><p class="eyebrow">YOUR PRIVATE STUDY NOTES</p><h2>Capture what matters</h2><p>Notes are saved in this browser and stay attached to this topic.</p><mat-form-field appearance="outline"><mat-label>Personal notes</mat-label><textarea matInput rows="9" [ngModel]="draft()" (ngModelChange)="draft.set($event)" placeholder="Add a reminder, example, or follow-up question..."></textarea></mat-form-field><div class="notes-actions"><button mat-flat-button color="primary" (click)="save()"><mat-icon>save</mat-icon>Save notes</button><button mat-button type="button" (click)="clear()" [disabled]="!draft()"><mat-icon>delete_outline</mat-icon>Clear</button><span>{{ draft().length }} characters</span></div></section>
  <aside class="revision-card"><span class="revision-icon"><mat-icon>fact_check</mat-icon></span><p class="eyebrow">BEFORE YOU MOVE ON</p><h3>Quick revision</h3>@for (point of revision(); track point) { <div class="revision-point"><mat-icon>done</mat-icon><span>{{ point }}</span></div> }</aside>
</div>
